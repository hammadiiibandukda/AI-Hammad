// into the long wing. It is not a closed surface, which is what every
// earlier attempt here got wrong.
//
// bake-mesh.mjs welds the export, subdivides it for finer wrinkles, and
// embeds it in the #logo-mesh block below. Re-run it after re-exporting.
// ===========================================================================

// The frame the home view renders through; the baked model is scaled to 2
// units wide to sit in it.
const VIEW = { hw: 1.0, hh: 0.675 };

function decode(b64, Type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Type(bytes.buffer);
}

function buildLogoMesh() {
  const data = JSON.parse(document.getElementById('logo-mesh').textContent);
  const rest = decode(data.positions, Float32Array);
  const indices = decode(data.indices, data.wide ? Uint32Array : Uint16Array);
  const count = rest.length / 3;

  // Every edge once, plus the vertex opposite it in each neighbouring
  // triangle — the opposite pairs become bending constraints.
  const edgeMap = new Map();
  const note = (a, b, opp) => {
    const k = a < b ? a * 1e6 + b : b * 1e6 + a;
    let e = edgeMap.get(k);
    if (!e) edgeMap.set(k, e = { a: Math.min(a,b), b: Math.max(a,b), opp: [] });
    e.opp.push(opp);
  };
  for (let t = 0; t < indices.length; t += 3) {
    const [a, b, c] = [indices[t], indices[t+1], indices[t+2]];
    note(a, b, c); note(b, c, a); note(c, a, b);
  }
  const edges = [], bends = [];
  for (const e of edgeMap.values()) {
    edges.push(e.a, e.b);
    if (e.opp.length === 2) bends.push(e.opp[0], e.opp[1]);
  }

  // The tip is the highest point; the hold falls off fast away from it, the
  // way it did from the apex row before.
  let tip = 0;
  for (let i = 1; i < count; i++) if (rest[i*3+1] > rest[tip*3+1]) tip = i;
  let far = 0;
  const dist = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    dist[i] = Math.hypot(rest[i*3]-rest[tip*3], rest[i*3+1]-rest[tip*3+1], rest[i*3+2]-rest[tip*3+2]);
    far = Math.max(far, dist[i]);
  }
  const anchor = new Float32Array(count), uvs = new Float32Array(count*2);
  for (let i = 0; i < count; i++) {
    anchor[i] = Math.pow(1 - dist[i]/far, 5);
    uvs[i*2] = rest[i*3]*0.5 + 0.5; uvs[i*2+1] = rest[i*3+1]*0.5 + 0.5;
  }

  return { rest, uvs, anchor, indices, count, edges: Uint32Array.from(edges),
           bends: Uint32Array.from(bends), tip, foldStart: count, source: data.source };
}

// ===========================================================================
// 2 · Cloth solver — substepped XPBD with self-collision
//
// XPBD with many small substeps and one solve each, which is far steadier than
// iterating a big step and gives stiffness that doesn't drift with resolution.
//
// There is no gravity. Home is a critically damped spring back to the rest
// pose, so releasing the silk eases it back rather than snapping it, and the
// whole sheet is free to be flown around in the meantime.
// ===========================================================================

const SILK = {
  substeps: 6,
  stretch: 2.0e-8,      // XPBD compliance: near zero, silk barely stretches
  shear:   6.0e-7,
  bend:    3.2e-5,      // enough spring to shake creases out instead of keeping them
  thickness: 0.040,     // fabric depth used for self-collision
  drag: 0.06,           // air resistance
  springHome: 58.0,     // stiffness of the pull back to the rest pose
  springHeld: 4.5,      // ... relaxed while a corner is being flown
  damping: 1.02,        // ×critical, so it settles without overshooting twice
  wind: 0.30, windScale: 2.1, windSpeed: 0.55,
};

class Cloth {
  constructor(mesh, tuning) {
    this.m = mesh; this.t = tuning; this.n = mesh.count;
    this.pos  = Float32Array.from(mesh.rest);
    this.prev = Float32Array.from(mesh.rest);
    this.vel  = new Float32Array(this.n*3);
    this.force = new Float32Array(this.n*3);
    this.rest = mesh.rest;
    this.held = new Float32Array(this.n);      // per-particle grab weight
    // The apex is pinched and the fold is tightly rolled: both are fine,
    // highly curved geometry that the wind would otherwise shake apart, so
    // they hold their shape harder than the open body of the veil does.
    this.kScale = new Float32Array(this.n);
    for (let i=0;i<this.n;i++)
      this.kScale[i] = 1 + 2.0*mesh.anchor[i] + (i >= mesh.foldStart ? 1.4 : 0);
    this.#constraints();
    this.#collisionBuffers();
    this.homeScale = 1;
  }

  #constraints() {
    // Stretch along every edge of the model, bending across every pair of
    // triangles that share one. No grid assumed — this runs on whatever
    // topology comes out of Blender.
    const { edges, bends } = this.m;
    const a=[], b=[], comp=[];
    const T = this.t;
    for (let e=0; e<edges.length; e+=2) { a.push(edges[e]); b.push(edges[e+1]); comp.push(T.stretch); }
    for (let e=0; e<bends.length; e+=2) { a.push(bends[e]); b.push(bends[e+1]); comp.push(T.bend); }
    this.ca = Int32Array.from(a); this.cb = Int32Array.from(b);
    this.cc = Float32Array.from(comp);
    this.cl = new Float32Array(a.length);
    this.lambda = new Float32Array(a.length);
    const R = this.rest;
    for (let c=0;c<a.length;c++) {
      const p=a[c]*3, q=b[c]*3;
      this.cl[c] = Math.hypot(R[p]-R[q], R[p+1]-R[q+1], R[p+2]-R[q+2]);
    }
  }

  // ---- self-collision -----------------------------------------------------
  // A counting-sort spatial hash, rebuilt once a frame; the pairs it finds are
  // then pushed apart on every substep. Each pair carries its own minimum
  // separation: particles that already sit close together in the rest pose
  // keep that spacing as the floor, everything else gets full fabric
  // thickness. That way the fold can lie against the body without the solver
  // treating its own rest shape as a collision.
  #collisionBuffers() {
    this.cellSize = this.t.thickness;      // one cell per search radius: 27 cells covers it
    this.tableSize = 1 << 15;   // sparse enough that unrelated cells rarely share a bucket
    this.cellStart = new Int32Array(this.tableSize + 1);
    this.cursor = new Int32Array(this.tableSize);
    this.entries = new Int32Array(this.n);
    this.keys = new Int32Array(this.n);
    this.maxPairs = 60000;
    this.pa = new Int32Array(this.maxPairs);
    this.pb = new Int32Array(this.maxPairs);
    this.psep = new Float32Array(this.maxPairs);
    this.pairCount = 0;
  }

  #hashKey(x,y,z) {
    return (((x * 92837111) ^ (y * 689287499) ^ (z * 283923481)) >>> 0) % this.tableSize;
  }

  buildPairs() {
    const { pos, rest, n, cellStart, cursor, entries, keys, tableSize } = this;
    const inv = 1/this.cellSize, thick = this.t.thickness;
    cellStart.fill(0);
    for (let i=0;i<n;i++) {
      const k = this.#hashKey(Math.floor(pos[i*3]*inv), Math.floor(pos[i*3+1]*inv), Math.floor(pos[i*3+2]*inv));
      keys[i] = k; cellStart[k]++;
    }
    let run = 0;
    for (let c=0;c<tableSize;c++) { const t = cellStart[c]; cellStart[c] = run; run += t; }
    cellStart[tableSize] = run;
    cursor.set(cellStart.subarray(0, tableSize));
    for (let i=0;i<n;i++) entries[cursor[keys[i]]++] = i;

    let count = 0;
    const broad = thick, broad2 = broad*broad;
    const neighbour2 = (thick*2.2)*(thick*2.2);
    for (let i=0;i<n;i++) {
      const ix = Math.floor(pos[i*3]*inv), iy = Math.floor(pos[i*3+1]*inv), iz = Math.floor(pos[i*3+2]*inv);
      for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++) {
        const k = this.#hashKey(ix+dx, iy+dy, iz+dz);
        for (let e=cellStart[k]; e<cellStart[k+1]; e++) {
          const j = entries[e];
          if (j <= i) continue;
          const p=i*3, q=j*3;
          const ddx=pos[q]-pos[p], ddy=pos[q+1]-pos[p+1], ddz=pos[q+2]-pos[p+2];
          const d2 = ddx*ddx+ddy*ddy+ddz*ddz;
          if (d2 > broad2) continue;
          const rx=rest[q]-rest[p], ry=rest[q+1]-rest[p+1], rz=rest[q+2]-rest[p+2];
          // Particles that are near neighbours in the weave are already held
          // by distance constraints; only genuinely separate pieces of cloth
          // are collision candidates, which is what keeps this list short.
          if (rx*rx+ry*ry+rz*rz < neighbour2) continue;
          const sep = thick;
          if (d2 > sep*sep) continue;
          if (count >= this.maxPairs) { this.pairCount = count; return; }
          this.pa[count]=i; this.pb[count]=j; this.psep[count]=sep; count++;
        }
      }
    }
    this.pairCount = count;
  }

  #solveCollisions() {
    const { pos, pa, pb, psep, pairCount, held } = this;
    for (let c=0;c<pairCount;c++) {
      const i=pa[c], j=pb[c], p=i*3, q=j*3, sep=psep[c];
      let dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
      let d2 = dx*dx+dy*dy+dz*dz;
      if (d2 >= sep*sep) continue;
      let d = Math.sqrt(d2);
      if (d < 1e-6) { dx = 1e-3; dy = 0; dz = 0; d = 1e-3; }
      const push = (sep - d) / d * 0.5;
      const wi = 1 - held[i], wj = 1 - held[j];
      const sum = wi + wj; if (sum < 1e-5) continue;
      const si = push * 2 * wi/sum, sj = push * 2 * wj/sum;
      pos[p] -= dx*si; pos[p+1] -= dy*si; pos[p+2] -= dz*si;
      pos[q] += dx*sj; pos[q+1] += dy*sj; pos[q+2] += dz*sj;
    }
  }

  #solveDistance(h2) {
    const { pos, ca, cb, cc, cl, lambda, held } = this;
    for (let c=0;c<ca.length;c++) {
      const i=ca[c], j=cb[c], p=i*3, q=j*3;
      const dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (d<1e-9) continue;
      const wi = 1 - held[i], wj = 1 - held[j];
      const wsum = wi + wj; if (wsum < 1e-5) continue;
      const alpha = cc[c] / h2;
      const C = d - cl[c];
      const dl = (-C - alpha*lambda[c]) / (wsum + alpha);
      lambda[c] += dl;
      const s = dl / d;
      pos[p] -= dx*s*wi; pos[p+1] -= dy*s*wi; pos[p+2] -= dz*s*wi;
      pos[q] += dx*s*wj; pos[q+1] += dy*s*wj; pos[q+2] += dz*s*wj;
    }
  }

  step(dt, dragging) {
    if (!(dt > 0)) return;
    const T = this.t, sub = T.substeps, h = dt/sub, h2 = h*h;
    const kBase = (dragging ? T.springHeld : T.springHome) * this.homeScale;
    const { pos, prev, vel, force, rest, held, kScale, n } = this;
    for (let s=0;s<sub;s++) {
      this.lambda.fill(0);          // XPBD multipliers are per-substep
      for (let i=0;i<n;i++) {
        const m3=i*3, hold = held[i];
        const k = kBase * kScale[i];
        const c = T.damping * 2 * Math.sqrt(k);      // critically damped return
        for (let a=0;a<3;a++) {
          const idx = m3+a;
          // Spring home plus its damper, wind, and a little air resistance.
          const accel = force[idx]
            + k*(rest[idx]-pos[idx]) - c*vel[idx] - T.drag*vel[idx]*Math.abs(vel[idx]);
          vel[idx] += accel*h*(1-hold);
          prev[idx] = pos[idx];
          pos[idx] += vel[idx]*h*(1-hold);
        }
      }
      this.#solveDistance(h2);
      this.#solveCollisions();
      for (let i=0;i<n;i++) {
        const m3=i*3;
        for (let a=0;a<3;a++) vel[m3+a] = (pos[m3+a]-prev[m3+a])/h;
      }
    }
    this.force.fill(0);
  }

  addForce(i, x, y, z) { const n=i*3; this.force[n]+=x; this.force[n+1]+=y; this.force[n+2]+=z; }

  energy() {
    let acc=0;
    for (let i=0;i<this.n;i++) {
      const n=i*3;
      acc += Math.abs(this.pos[n]-this.rest[n]) + Math.abs(this.pos[n+1]-this.rest[n+1])
           + Math.abs(this.pos[n+2]-this.rest[n+2]);
    }
    return acc/this.n;
  }

  // Worst interpenetration currently present, as a fraction of fabric
  // thickness. Zero means no two pieces of cloth are inside each other.
  worstOverlap() {
    let worst = 0;
    for (let c=0;c<this.pairCount;c++) {
      const p=this.pa[c]*3, q=this.pb[c]*3, sep=this.psep[c];
      const d = Math.hypot(this.pos[q]-this.pos[p], this.pos[q+1]-this.pos[p+1], this.pos[q+2]-this.pos[p+2]);
      if (d < sep) worst = Math.max(worst, (sep-d)/sep);
    }
    return worst;
  }
}

// ===========================================================================
// 3 · Scene
//
// One fabric, one colour. Everything darker than #FF6625 on screen — including
// the deep tone inside the fold that the flat artwork draws as #D0470C — is
// the silk shading itself: the fold turns away from the key light and casts
// onto its own underside.
// ===========================================================================

const BRAND = { silk:'#FF6625', bounce:'#7A2600', sky:'#FFF3E6', page:'#FBF8EF' };

const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
} catch (err) {
  canvas.style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('fallback').style.display='block';
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;   // keep the brand orange exact where fully lit

const pageColor = () =>
  getComputedStyle(document.documentElement).getPropertyValue('--page').trim() || BRAND.page;
const applyGround = () => renderer.setClearColor(new THREE.Color(pageColor()), 1);
applyGround();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyGround);
new MutationObserver(applyGround).observe(document.documentElement, { attributeFilter:['data-theme'] });

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.21;

const mesh = buildLogoMesh();
const cloth = new Cloth(mesh, SILK);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(cloth.pos, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(mesh.uvs, 2));
geometry.setIndex(new THREE.BufferAttribute(mesh.indices, 1));
geometry.computeVertexNormals();

const material = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(BRAND.silk),
  roughness: 0.56, metalness: 0.0,
  sheen: 1.0, sheenColor: new THREE.Color('#FFCDB4'), sheenRoughness: 0.34,
  side: THREE.DoubleSide, shadowSide: THREE.DoubleSide,
  envMapIntensity: 0.5,
});

// Cavity shading. Every surface facing away from the camera is the inside of
// the cone, and the inside of a cone is occluded — it sees far less of the
// room than the outside does. Darkening and warming it there is what turns the
// flat artwork's #D0470C into something the lighting produces rather than
// something a second material declares.
const INTERIOR = { darken: 1.0, tint: new THREE.Color('#C03806'), mix: 0.55 };
material.onBeforeCompile = (shader) => {
  shader.uniforms.uInteriorDarken = { value: INTERIOR.darken };
  shader.uniforms.uInteriorTint = { value: INTERIOR.tint };
  shader.uniforms.uInteriorMix = { value: INTERIOR.mix };
  shader.fragmentShader =
    'uniform float uInteriorDarken;\nuniform vec3 uInteriorTint;\nuniform float uInteriorMix;\n'
    + shader.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
       if (!gl_FrontFacing) diffuseColor.rgb =
         mix(diffuseColor.rgb * uInteriorDarken, uInteriorTint, uInteriorMix);`);
  material.userData.shader = shader;
};

const cloak = new THREE.Mesh(geometry, material);
cloak.castShadow = true; cloak.receiveShadow = true;
scene.add(cloak);

geometry.computeBoundingBox();
const CENTER = new THREE.Vector3();
geometry.boundingBox.getCenter(CENTER);
const FLOOR = geometry.boundingBox.min.y - 0.65;

// Key rakes across the drape from the upper left, which is what drops the
// inside of the fold into shadow.
const key = new THREE.DirectionalLight(0xFFF1E4, 2.55);
key.position.set(-2.4, 3.2, 2.8);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -2.2; key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2;   key.shadow.camera.bottom = -2.2;
key.shadow.camera.near = 0.5;  key.shadow.camera.far = 12;
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.018; key.shadow.radius = 2.5;
scene.add(key, key.target);
key.target.position.copy(CENTER);

const fill = new THREE.DirectionalLight(0xF0E4E0, 0.26);
fill.position.set(3.0, -0.6, 1.4);
scene.add(fill);

// Warm bounce from below tints the shadowed interior toward the brand's dark
// orange rather than letting it go grey.
scene.add(new THREE.HemisphereLight(new THREE.Color(BRAND.sky), new THREE.Color(BRAND.bounce), 0.34));

const groundShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.14 })
);
groundShadow.rotation.x = -Math.PI/2;
groundShadow.position.set(CENTER.x, FLOOR, CENTER.z);
groundShadow.receiveShadow = true;
scene.add(groundShadow);

// ===========================================================================
// 4 · Camera, orbit, and flying it around
// ===========================================================================

// Orthographic on purpose. Under perspective the left tip — which sits well
// behind the right — would shrink by about 6%, and the home view would stop
// being the logo. Ortho keeps the mark exact head-on and still orbits freely.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const HOME = new THREE.Vector3(CENTER.x, CENTER.y, CENTER.z + 6);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(CENTER);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.screenSpacePanning = true;
controls.minZoom = 0.35; controls.maxZoom = 6;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const aspect = w/h, fit = 1.30;
  const hw = aspect > VIEW.hw/VIEW.hh ? VIEW.hh*fit*aspect : VIEW.hw*fit;
  const hh = aspect > VIEW.hw/VIEW.hh ? VIEW.hh*fit : VIEW.hw*fit/aspect;
  camera.left=-hw; camera.right=hw; camera.top=hh; camera.bottom=-hh;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
controls.update();

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const grabPoint = new THREE.Vector3();
const dragPoint = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
let grabbed = [];          // {i, ox, oy, oz, w}
let dragging = false, interacted = false;

const setNdc = (ev) => {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((ev.clientX-r.left)/r.width)*2-1;
  ndc.y = -((ev.clientY-r.top)/r.height)*2+1;
};

canvas.addEventListener('pointerdown', (ev) => {
  setNdc(ev);
  ray.setFromCamera(ndc, camera);
  geometry.computeBoundingSphere();
  const hit = ray.intersectObject(cloak, false)[0];
  if (!hit) return;                               // empty space: leave it to the orbit
  hitPoint.copy(hit.point);
  grabPoint.copy(hit.point);
  dragPoint.copy(hit.point);
  dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), hit.point);

  // Take a handful of silk, not a single vertex, so it flies coherently.
  const R = 0.30, R2 = R*R;
  grabbed = [];
  cloth.held.fill(0);
  for (let i=0;i<mesh.count;i++) {
    const n=i*3;
    const dx=cloth.pos[n]-hit.point.x, dy=cloth.pos[n+1]-hit.point.y, dz=cloth.pos[n+2]-hit.point.z;
    const d2 = dx*dx+dy*dy+dz*dz;
    if (d2 > R2) continue;
    const t = 1 - Math.sqrt(d2)/R;
    const w = t*t*(3-2*t);                        // smooth falloff
    cloth.held[i] = w;
    grabbed.push({ i, ox:dx, oy:dy, oz:dz, w });
  }
  if (!grabbed.length) return;
  dragging = true;
  controls.enabled = false;
  canvas.classList.add('grabbing');
  canvas.setPointerCapture(ev.pointerId);
  interacted = true;
  document.getElementById('hint').classList.add('gone');
});

canvas.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  setNdc(ev);
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(dragPlane, dragPoint);
});

const release = () => {
  if (!dragging) return;
  dragging = false;
  cloth.held.fill(0);
  grabbed = [];
  controls.enabled = true;
  canvas.classList.remove('grabbing');
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

canvas.addEventListener('dblclick', () => {
  camera.position.copy(HOME);
  controls.target.copy(CENTER);
  controls.update();
});

// ===========================================================================
// 5 · Loop
// ===========================================================================

const noise = (x,y,t) =>
    Math.sin(x*1.7 + t*0.9) * Math.cos(y*2.3 - t*0.7)
  + 0.5 * Math.sin(x*3.1 - y*2.7 + t*1.31)
  + 0.25 * Math.cos(x*5.3 + y*4.1 - t*1.9);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), frozen = false, lastFrameMs = 0;

function frame(now) {
  if (!reduced) requestAnimationFrame(frame);
  // Never zero: XPBD divides compliance by the substep squared, and a zero
  // frame turns that into Infinity * 0 = NaN, which poisons every position.
  const dt = Math.min(Math.max((now-last)/1000, 1/1000), 1/30); last = now;

  if (!frozen) {
    const t = now/1000;
    if (!reduced) {
      // Levitation: a slow swell across the whole sheet, plus wind that the
      // free edges feel more than the body.
      const { rest, force } = cloth;
      const W = SILK.wind, S = SILK.windScale, sp = t*SILK.windSpeed;
      // Sized so the whole mark drifts about 2% of its width, not so much
      // that the levitation itself pulls the silhouette off the artwork.
      const swellX = (Math.sin(t*0.41)*0.9 + Math.sin(t*0.23)*0.4) * 0.55;
      const swellY = (Math.sin(t*0.57)*0.8 + Math.cos(t*0.31)*0.35) * 0.55;
      for (let i=0;i<mesh.count;i++) {
        const n=i*3;
        const free = (0.3 + 0.7*(1 - mesh.anchor[i])) * (i >= mesh.foldStart ? 0.45 : 1);
        const x=rest[n]*S, y=rest[n+1]*S;
        force[n]   += swellX + noise(x, y, sp) * W * free * 0.6;
        force[n+1] += swellY + noise(x+11.3, y-4.7, sp*0.9) * W * free * 0.5;
        force[n+2] += noise(x-7.1, y+9.2, sp*1.1) * W * free;
      }
    }

    if (dragging) {
      // Carry the held handful to the pointer, and keep its velocity so
      // letting go mid-flick actually throws the silk.
      for (const g of grabbed) {
        const n = g.i*3;
        const tx = dragPoint.x + g.ox, ty = dragPoint.y + g.oy, tz = dragPoint.z + g.oz;
        cloth.vel[n]   = (tx - cloth.pos[n])/Math.max(dt,1e-3);
        cloth.vel[n+1] = (ty - cloth.pos[n+1])/Math.max(dt,1e-3);
        cloth.vel[n+2] = (tz - cloth.pos[n+2])/Math.max(dt,1e-3);
        cloth.pos[n]   += (tx - cloth.pos[n])*g.w;
        cloth.pos[n+1] += (ty - cloth.pos[n+1])*g.w;
        cloth.pos[n+2] += (tz - cloth.pos[n+2])*g.w;
      }
    }

    // Settled silk cannot be inside itself, so the broad phase only earns its
    // cost while something is actually moving.
    if (dragging || cloth.energy() > 0.004) cloth.buildPairs(); else cloth.pairCount = 0;
    cloth.step(dt, dragging);
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();
    geometry.attributes.normal.needsUpdate = true;
    geometry.computeBoundingSphere();
  }

  if (!frozen) controls.update();     // frozen means a test owns the camera
  renderer.render(scene, camera);
  lastFrameMs = performance.now() - now;
}

if (reduced) {
  geometry.attributes.position.needsUpdate = true;
  geometry.computeBoundingSphere();
  controls.update();
  renderer.render(scene, camera);
} else {
  requestAnimationFrame(frame);
  setTimeout(() => { if (!interacted) document.getElementById('hint').classList.add('gone'); }, 11000);
}

// Hooks for the checks in verify.mjs / motion.mjs / interact.mjs.
window.__cloak = {
  homeView(px, py, keepState) {
    frozen = true;
    if (!keepState) { cloth.pos.set(cloth.rest); cloth.vel.fill(0); }
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    renderer.setPixelRatio(1); renderer.setSize(px, py, false);
    canvas.style.width = px+'px'; canvas.style.height = py+'px';
    camera.position.set(0, 0, 6);
    controls.target.set(0, 0, 0);
    camera.zoom = 1;
    camera.left=-VIEW.hw; camera.right=VIEW.hw; camera.top=VIEW.hh; camera.bottom=-VIEW.hh;
    camera.updateProjectionMatrix();
    camera.lookAt(0,0,0); camera.updateMatrixWorld();   // not controls.update(): it owns its own state
    renderer.render(scene, camera);
  },
  orbit(theta, phi) {
    const r = 6;
    camera.position.set(r*Math.sin(theta)*Math.cos(phi), r*Math.sin(phi), r*Math.cos(theta)*Math.cos(phi));
    camera.lookAt(0,0,0); camera.updateMatrixWorld();
    renderer.render(scene, camera);
  },
  poke(strength = 1) {
    frozen = false;
    for (let i=0;i<mesh.count;i++) {
      const n=i*3, free = 1 - mesh.anchor[i]*0.5;
      cloth.vel[n]   += 1.7*strength*free;
      cloth.vel[n+1] += 1.0*strength*free*Math.sin(mesh.uvs[i*2]*6.0);
      cloth.vel[n+2] += 1.4*strength*free;
    }
  },
  thaw() { frozen = false; },
  setZoom(z) { camera.zoom = z; camera.updateProjectionMatrix(); renderer.render(scene, camera); },
  profile(n) {
    const t0=performance.now(); for(let i=0;i<n;i++) cloth.buildPairs(); const tPairs=(performance.now()-t0)/n;
    const t1=performance.now(); for(let i=0;i<n;i++) cloth.step(1/60,false); const tStep=(performance.now()-t1)/n;
    const t2=performance.now(); for(let i=0;i<n;i++) geometry.computeVertexNormals(); const tNorm=(performance.now()-t2)/n;
    const t3=performance.now(); for(let i=0;i<n;i++) renderer.render(scene,camera); const tDraw=(performance.now()-t3)/n;
    return { pairs:+tPairs.toFixed(2), solve:+tStep.toFixed(2), normals:+tNorm.toFixed(2), draw:+tDraw.toFixed(2) };
  },
  energy: () => cloth.energy(),
  overlap: () => cloth.worstOverlap(),
  pairs: () => cloth.pairCount,
  frameMs: () => lastFrameMs,
  stats: { verts: mesh.count, tris: mesh.indices.length/3, source: mesh.source },
};
</script>
