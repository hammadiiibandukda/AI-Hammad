<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===========================================================================
// 1 · The mark, as geometry
//
// Modelled in Blender from the mark itself, not generated here: one open
// sheet, rolled a little over half a turn around the apex and twisted down
// its length. The left edge curls back under itself — the dark lobe in the
// flat artwork is the inside of that curl — and the right edge runs out
// into the long wing. It is not a closed surface, which is what every
// earlier attempt here got wrong.
//
// bake-mesh.mjs welds the export, subdivides it for finer wrinkles, and
// embeds it in the #logo-mesh block below. Re-run it after re-exporting.
// ===========================================================================

// The frame the home view renders through; the baked model is scaled to 2
// units wide to sit in it.
const VIEW = { hw: 1.0, hh: 0.675 };

function decode(b64, Type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Type(bytes.buffer);
}

function buildLogoMesh() {
  const data = JSON.parse(document.getElementById('logo-mesh').textContent);
  const rest = decode(data.positions, Float32Array);
  const indices = decode(data.indices, data.wide ? Uint32Array : Uint16Array);
  const count = rest.length / 3;

  // Every edge once, plus the vertex opposite it in each neighbouring
  // triangle — the opposite pairs become bending constraints.
  const edgeMap = new Map();
  const note = (a, b, opp) => {
    const k = a < b ? a * 1e6 + b : b * 1e6 + a;
    let e = edgeMap.get(k);
    if (!e) edgeMap.set(k, e = { a: Math.min(a,b), b: Math.max(a,b), from: a, to: b, opp: [] });
    e.opp.push(opp);
  };
  for (let t = 0; t < indices.length; t += 3) {
    const [a, b, c] = [indices[t], indices[t+1], indices[t+2]];
    note(a, b, c); note(b, c, a); note(c, a, b);
  }
  const edges = [], bends = [], boundary = [];
  for (const e of edgeMap.values()) {
    edges.push(e.a, e.b);
    if (e.opp.length === 2) bends.push(e.opp[0], e.opp[1]);
    else boundary.push(e.from, e.to);          // as wound in its one triangle
  }

  // Links two and three steps apart across the surface. One-step bending only
  // stops a fold between neighbouring faces; these make a bend spread over a
  // wide area, which is the difference between a carpet and paper.
  const nb = Array.from({ length: count }, () => []);
  for (let e = 0; e < edges.length; e += 2) { nb[edges[e]].push(edges[e+1]); nb[edges[e+1]].push(edges[e]); }
  const hop2 = [], hop3 = [];
  const depth = new Int8Array(count).fill(-1);
  for (let s = 0; s < count; s++) {
    const touched = [s]; depth[s] = 0;
    let frontier = [s];
    for (let d = 1; d <= 3; d++) {
      const next = [];
      for (const u of frontier) for (const w of nb[u]) if (depth[w] < 0) { depth[w] = d; next.push(w); touched.push(w); }
      if (d >= 2) for (const w of next) if (w > s) (d === 2 ? hop2 : hop3).push(s, w);
      frontier = next;
    }
    for (const w of touched) depth[w] = -1;
  }

  // The binding. Walk the rim in order and link each point to the next few
  // along it. Edge points have fewer neighbours than the body, so without
  // this the rim is the weakest place and takes every fold — a real carpet
  // has it the other way round, with a bound edge stiffer than the weave.
  const next = new Map();
  for (let e = 0; e < boundary.length; e += 2) next.set(boundary[e], boundary[e+1]);
  const loop = [];
  if (boundary.length) {
    let v = boundary[0];
    do { loop.push(v); v = next.get(v); } while (v !== undefined && v !== boundary[0] && loop.length <= next.size);
  }
  const hem = [];
  for (let k = 0; k < loop.length; k++)
    for (const step of [2, 3, 4]) hem.push(loop[k], loop[(k + step) % loop.length]);

  // The tip is the highest point; the hold falls off fast away from it, the
  // way it did from the apex row before.
  let tip = 0;
  for (let i = 1; i < count; i++) if (rest[i*3+1] > rest[tip*3+1]) tip = i;
  let far = 0;
  const dist = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    dist[i] = Math.hypot(rest[i*3]-rest[tip*3], rest[i*3+1]-rest[tip*3+1], rest[i*3+2]-rest[tip*3+2]);
    far = Math.max(far, dist[i]);
  }
  const anchor = new Float32Array(count), uvs = new Float32Array(count*2);
  for (let i = 0; i < count; i++) {
    anchor[i] = Math.pow(1 - dist[i]/far, 5);
    uvs[i*2] = rest[i*3]*0.5 + 0.5; uvs[i*2+1] = rest[i*3+1]*0.5 + 0.5;
  }

  return { rest, uvs, anchor, indices, count, edges: Uint32Array.from(edges),
           bends: Uint32Array.from(bends), hop2: Uint32Array.from(hop2), hop3: Uint32Array.from(hop3),
           boundary: Uint32Array.from(boundary), hem: Uint32Array.from(hem), rimLoop: loop.length, along: dist, tip, foldStart: count, source: data.source };
}

// ===========================================================================
// 2 · Carpet solver — substepped XPBD with self-collision
//
// XPBD with many small substeps and one solve each, which is far steadier than
// iterating a big step and gives stiffness that doesn't drift with resolution.
//
// The fabric is a thick carpet, not silk: it doesn't stretch, and it resists
// bending over a wide area, so it can only curve in broad arcs — it can't
// crease, crumple or bunch up. It's heavy and damped past critical, so it
// moves in slow waves rather than shivering.
//
// There is no gravity. Every point has a spring to where it should be — the
// rest pose at home, or laid along the path it's being flown on (section 5a)
// — so it eases into place rather than snapping, loose while it's flown so
// it trails.
// ===========================================================================

const CARPET = {
  substeps: 8,
  stretch: 1.0e-8,     // XPBD compliance, lower is stiffer: it doesn't stretch
  bend:    2.0e-7,     // between neighbouring faces
  bend2:   1.0e-6,     // two steps across the surface
  bend3:   3.0e-6,     // three steps
  hem:     2.0e-7,     // the bound edge, stiffer than the body
  shape:   0.45,       // how hard each small patch holds its own shape — this is
                       // what stops it creasing; see #shapeMatch
  thickness: 0.055,    // collision: layers never come closer than this
  render: 0.012,       // how thick it looks
  aero: 3.0,           // air pushing back on its faces: why it billows and trails
  drag: 0.02,          // a little resistance in every direction
  springHome: 45.0,    // heavy: comes home unhurried, but decisively
  springHeld: 14.0,    // how closely it keeps to its path while you fly it: loose, so it trails
  damping: 1.0,        // critical: the quickest return with no bounce-back
  grab:    0.18,       // radius of the handful you pick up
  wave: 0.55, waveLength: 1.3, waveSpeed: 1.25,   // the ripple that runs along it while it hovers
};

class Cloth {
  constructor(mesh, tuning) {
    this.m = mesh; this.t = tuning; this.n = mesh.count;
    this.pos  = Float32Array.from(mesh.rest);
    this.prev = Float32Array.from(mesh.rest);
    this.vel  = new Float32Array(this.n*3);
    this.force = new Float32Array(this.n*3);
    this.rest = mesh.rest;
    this.held = new Float32Array(this.n);      // per-particle grab weight
    // The tip is where it hangs from, so it holds its place harder than the
    // body does.
    this.kScale = new Float32Array(this.n);
    for (let i=0;i<this.n;i++)
      this.kScale[i] = 1 + 2.0*mesh.anchor[i] + (i >= mesh.foldStart ? 1.4 : 0);
    this.#constraints();
    this.#regions();
    this.#collisionBuffers();
    this.homeScale = 1;
    // Where the home spring pulls. The rest pose itself at home; while it's
    // being flown, the rest pose laid along its path (section 5a).
    this.target = this.rest;
    this.collide = true;          // switched off only to untangle; see the loop
  }

  #constraints() {
    // Stretch along every edge of the model; bending across every pair of
    // triangles that share one, and again two and three steps apart. No
    // grid assumed — this runs on whatever topology comes out of Blender.
    const { edges, bends, hop2, hop3, hem } = this.m;
    const a=[], b=[], comp=[];
    const T = this.t;
    const add = (list, c) => { for (let e=0; e<list.length; e+=2) { a.push(list[e]); b.push(list[e+1]); comp.push(c); } };
    add(edges, T.stretch);
    add(bends, T.bend);
    add(hop2, T.bend2);
    add(hop3, T.bend3);
    add(hem, T.hem);
    let at = 0;
    this.groups = [[edges, 'stretch'], [bends, 'bend'], [hop2, 'bend2'], [hop3, 'bend3'], [hem, 'hem']]
      .map(([list, key]) => { const g = [at, list.length/2, key]; at += list.length/2; return g; });
    this.ca = Int32Array.from(a); this.cb = Int32Array.from(b);
    this.cc = Float32Array.from(comp);
    this.cl = new Float32Array(a.length);
    this.lambda = new Float32Array(a.length);
    const R = this.rest;
    for (let c=0;c<a.length;c++) {
      const p=a[c]*3, q=b[c]*3;
      this.cl[c] = Math.hypot(R[p]-R[q], R[p+1]-R[q+1], R[p+2]-R[q+2]);
    }
  }

  // ---- shape matching ------------------------------------------------------
  // Every point owns a patch: itself and everything within two steps. Each
  // patch finds the rotation that best fits its current shape to its rest
  // shape, and pulls its points toward that rigidly rotated rest shape. A
  // crease inside any patch is expensive; a broad curve spread over many
  // patches is cheap. That is the difference between a carpet and paper,
  // and it's what point-to-point links can't capture on their own.
  #regions() {
    const n = this.n, { edges } = this.m, R = this.rest;
    const nb = Array.from({ length: n }, () => []);
    for (let e = 0; e < edges.length; e += 2) { nb[edges[e]].push(edges[e+1]); nb[edges[e+1]].push(edges[e]); }
    const offs = new Int32Array(n + 1), members = [], local = [];
    const count = new Float32Array(n);
    const mark = new Int32Array(n).fill(-1);
    for (let s = 0; s < n; s++) {
      const set = [s]; mark[s] = s;
      for (const u of nb[s]) if (mark[u] !== s) { mark[u] = s; set.push(u); }
      for (let k = 1, len = set.length; k < len; k++)
        for (const w of nb[set[k]]) if (mark[w] !== s) { mark[w] = s; set.push(w); }
      let cx = 0, cy = 0, cz = 0;
      for (const v of set) { cx += R[v*3]; cy += R[v*3+1]; cz += R[v*3+2]; }
      cx /= set.length; cy /= set.length; cz /= set.length;
      offs[s] = members.length;
      for (const v of set) { members.push(v); local.push(R[v*3]-cx, R[v*3+1]-cy, R[v*3+2]-cz); count[v]++; }
    }
    offs[n] = members.length;
    this.rOffs = offs; this.rMembers = Int32Array.from(members); this.rLocal = Float32Array.from(local);
    this.rInv = count.map(c => c ? 1/c : 0);
    this.rQuat = new Float32Array(n * 4); for (let r = 0; r < n; r++) this.rQuat[r*4+3] = 1;
    this.goal = new Float32Array(n * 3);
  }

  // Rotation part of A, by the iterative quaternion method (Müller et al.
  // 2016): robust when a patch is nearly flat, and warm-started from the last
  // step so two iterations are enough. Scalar maths throughout — this runs for
  // every patch on every substep, and small allocations here add up.
  #rotation(A, r, out) {
    const Q = this.rQuat;
    let qx=Q[r*4], qy=Q[r*4+1], qz=Q[r*4+2], qw=Q[r*4+3];
    for (let it = 0; it < 2; it++) {
      const xx=qx*qx, yy=qy*qy, zz=qz*qz, xy=qx*qy, xz=qx*qz, yz=qy*qz, wx=qw*qx, wy=qw*qy, wz=qw*qz;
      // columns of the current rotation
      const r00=1-2*(yy+zz), r10=2*(xy+wz), r20=2*(xz-wy);
      const r01=2*(xy-wz), r11=1-2*(xx+zz), r21=2*(yz+wx);
      const r02=2*(xz+wy), r12=2*(yz-wx), r22=1-2*(xx+yy);
      // sum over columns of R_col × A_col, over the matching dot products
      const ox = (r10*A[6]-r20*A[3]) + (r11*A[7]-r21*A[4]) + (r12*A[8]-r22*A[5]);
      const oy = (r20*A[0]-r00*A[6]) + (r21*A[1]-r01*A[7]) + (r22*A[2]-r02*A[8]);
      const oz = (r00*A[3]-r10*A[0]) + (r01*A[4]-r11*A[1]) + (r02*A[5]-r12*A[2]);
      const dd = r00*A[0]+r10*A[3]+r20*A[6] + r01*A[1]+r11*A[4]+r21*A[7] + r02*A[2]+r12*A[5]+r22*A[8];
      const inv = 1 / (Math.abs(dd) + 1e-9);
      const wxv = ox*inv, wyv = oy*inv, wzv = oz*inv;
      const w = Math.sqrt(wxv*wxv + wyv*wyv + wzv*wzv);
      if (w < 1e-9) break;
      const sn = Math.sin(w/2)/w, dx=wxv*sn, dy=wyv*sn, dz=wzv*sn, dw=Math.cos(w/2);
      const nx = dw*qx + dx*qw + dy*qz - dz*qy, ny = dw*qy - dx*qz + dy*qw + dz*qx;
      const nz = dw*qz + dx*qy - dy*qx + dz*qw, nw = dw*qw - dx*qx - dy*qy - dz*qz;
      const l = 1 / (Math.sqrt(nx*nx+ny*ny+nz*nz+nw*nw) || 1);
      qx=nx*l; qy=ny*l; qz=nz*l; qw=nw*l;
    }
    Q[r*4]=qx; Q[r*4+1]=qy; Q[r*4+2]=qz; Q[r*4+3]=qw;
    const xx=qx*qx, yy=qy*qy, zz=qz*qz, xy=qx*qy, xz=qx*qz, yz=qy*qz, wx=qw*qx, wy=qw*qy, wz=qw*qz;
    out[0]=1-2*(yy+zz); out[1]=2*(xy-wz);   out[2]=2*(xz+wy);
    out[3]=2*(xy+wz);   out[4]=1-2*(xx+zz); out[5]=2*(yz-wx);
    out[6]=2*(xz-wy);   out[7]=2*(yz+wx);   out[8]=1-2*(xx+yy);
  }

  #shapeMatch(alpha) {
    if (alpha <= 0) return;
    const { pos, held, rOffs, rMembers, rLocal, rInv, goal, n } = this;
    goal.fill(0);
    const A = this.rA || (this.rA = new Float64Array(9)), Rm = this.rR || (this.rR = new Float64Array(9));
    for (let r = 0; r < n; r++) {
      const a = rOffs[r], b = rOffs[r+1], m = b - a;
      let cx=0, cy=0, cz=0;
      for (let k = a; k < b; k++) { const v = rMembers[k]*3; cx += pos[v]; cy += pos[v+1]; cz += pos[v+2]; }
      cx /= m; cy /= m; cz /= m;
      A.fill(0);
      for (let k = a; k < b; k++) {
        const v = rMembers[k]*3, px = pos[v]-cx, py = pos[v+1]-cy, pz = pos[v+2]-cz;
        const qx = rLocal[k*3], qy = rLocal[k*3+1], qz = rLocal[k*3+2];
        A[0]+=px*qx; A[1]+=px*qy; A[2]+=px*qz; A[3]+=py*qx; A[4]+=py*qy; A[5]+=py*qz; A[6]+=pz*qx; A[7]+=pz*qy; A[8]+=pz*qz;
      }
      this.#rotation(A, r, Rm);
      for (let k = a; k < b; k++) {
        const v = rMembers[k]*3, qx = rLocal[k*3], qy = rLocal[k*3+1], qz = rLocal[k*3+2];
        goal[v]   += Rm[0]*qx + Rm[1]*qy + Rm[2]*qz + cx;
        goal[v+1] += Rm[3]*qx + Rm[4]*qy + Rm[5]*qz + cy;
        goal[v+2] += Rm[6]*qx + Rm[7]*qy + Rm[8]*qz + cz;
      }
    }
    for (let i = 0; i < n; i++) {
      const f = alpha * (1 - held[i]);
      pos[i*3]   += goal[i*3]*rInv[i]*f - pos[i*3]*f;
      pos[i*3+1] += goal[i*3+1]*rInv[i]*f - pos[i*3+1]*f;
      pos[i*3+2] += goal[i*3+2]*rInv[i]*f - pos[i*3+2]*f;
    }
  }

  // ---- self-collision -----------------------------------------------------
  // A counting-sort spatial hash, rebuilt once a frame; the pairs it finds are
  // then pushed apart on every substep. Each pair carries its own minimum
  // separation: particles that already sit close together in the rest pose
  // keep that spacing as the floor, everything else gets full fabric
  // thickness. That way the fold can lie against the body without the solver
  // treating its own rest shape as a collision.
  #collisionBuffers() {
    this.cellSize = this.t.thickness;      // one cell per search radius: 27 cells covers it
    this.tableSize = 1 << 15;   // sparse enough that unrelated cells rarely share a bucket
    this.cellStart = new Int32Array(this.tableSize + 1);
    this.cursor = new Int32Array(this.tableSize);
    this.entries = new Int32Array(this.n);
    this.keys = new Int32Array(this.n);
    this.maxPairs = 60000;
    this.pa = new Int32Array(this.maxPairs);
    this.pb = new Int32Array(this.maxPairs);
    this.psep = new Float32Array(this.maxPairs);
    this.pairCount = 0;
  }

  #hashKey(x,y,z) {
    return (((x * 92837111) ^ (y * 689287499) ^ (z * 283923481)) >>> 0) % this.tableSize;
  }

  buildPairs() {
    const { pos, rest, n, cellStart, cursor, entries, keys, tableSize } = this;
    const inv = 1/this.cellSize, thick = this.t.thickness;
    cellStart.fill(0);
    for (let i=0;i<n;i++) {
      const k = this.#hashKey(Math.floor(pos[i*3]*inv), Math.floor(pos[i*3+1]*inv), Math.floor(pos[i*3+2]*inv));
      keys[i] = k; cellStart[k]++;
    }
    let run = 0;
    for (let c=0;c<tableSize;c++) { const t = cellStart[c]; cellStart[c] = run; run += t; }
    cellStart[tableSize] = run;
    cursor.set(cellStart.subarray(0, tableSize));
    for (let i=0;i<n;i++) entries[cursor[keys[i]]++] = i;

    let count = 0;
    const broad = thick, broad2 = broad*broad;
    const neighbour2 = (thick*2.2)*(thick*2.2);
    for (let i=0;i<n;i++) {
      const ix = Math.floor(pos[i*3]*inv), iy = Math.floor(pos[i*3+1]*inv), iz = Math.floor(pos[i*3+2]*inv);
      for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++) {
        const k = this.#hashKey(ix+dx, iy+dy, iz+dz);
        for (let e=cellStart[k]; e<cellStart[k+1]; e++) {
          const j = entries[e];
          if (j <= i) continue;
          const p=i*3, q=j*3;
          const ddx=pos[q]-pos[p], ddy=pos[q+1]-pos[p+1], ddz=pos[q+2]-pos[p+2];
          const d2 = ddx*ddx+ddy*ddy+ddz*ddz;
          if (d2 > broad2) continue;
          const rx=rest[q]-rest[p], ry=rest[q+1]-rest[p+1], rz=rest[q+2]-rest[p+2];
          // Particles that are near neighbours in the weave are already held
          // by distance constraints; only genuinely separate pieces of cloth
          // are collision candidates, which is what keeps this list short.
          if (rx*rx+ry*ry+rz*rz < neighbour2) continue;
          const sep = thick;
          if (d2 > sep*sep) continue;
          if (count >= this.maxPairs) { this.pairCount = count; return; }
          this.pa[count]=i; this.pb[count]=j; this.psep[count]=sep; count++;
        }
      }
    }
    this.pairCount = count;
  }

  #solveCollisions() {
    if (!this.collide) return;
    const { pos, pa, pb, psep, pairCount, held } = this;
    for (let c=0;c<pairCount;c++) {
      const i=pa[c], j=pb[c], p=i*3, q=j*3, sep=psep[c];
      let dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
      let d2 = dx*dx+dy*dy+dz*dz;
      if (d2 >= sep*sep) continue;
      let d = Math.sqrt(d2);
      if (d < 1e-6) { dx = 1e-3; dy = 0; dz = 0; d = 1e-3; }
      const push = (sep - d) / d * 0.5;
      const wi = 1 - held[i], wj = 1 - held[j];
      const sum = wi + wj; if (sum < 1e-5) continue;
      const si = push * 2 * wi/sum, sj = push * 2 * wj/sum;
      pos[p] -= dx*si; pos[p+1] -= dy*si; pos[p+2] -= dz*si;
      pos[q] += dx*sj; pos[q+1] += dy*sj; pos[q+2] += dz*sj;
    }
  }

  #solveDistance(h2) {
    const { pos, ca, cb, cc, cl, lambda, held } = this;
    for (let c=0;c<ca.length;c++) {
      const i=ca[c], j=cb[c], p=i*3, q=j*3;
      const dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (d<1e-9) continue;
      const wi = 1 - held[i], wj = 1 - held[j];
      const wsum = wi + wj; if (wsum < 1e-5) continue;
      const alpha = cc[c] / h2;
      const C = d - cl[c];
      const dl = (-C - alpha*lambda[c]) / (wsum + alpha);
      lambda[c] += dl;
      const s = dl / d;
      pos[p] -= dx*s*wi; pos[p+1] -= dy*s*wi; pos[p+2] -= dz*s*wi;
      pos[q] += dx*s*wj; pos[q+1] += dy*s*wj; pos[q+2] += dz*s*wj;
    }
  }

  step(dt, dragging) {
    if (!(dt > 0)) return;
    const T = this.t, sub = T.substeps, h = dt/sub, h2 = h*h;
    const kBase = (dragging ? T.springHeld : T.springHome) * this.homeScale;
    const { pos, prev, vel, force, target, held, kScale, n } = this;
    for (let s=0;s<sub;s++) {
      this.lambda.fill(0);          // XPBD multipliers are per-substep
      for (let i=0;i<n;i++) {
        const m3=i*3, hold = held[i];
        const k = kBase * kScale[i];
        const c = T.damping * 2 * Math.sqrt(k);      // critically damped return
        for (let a=0;a<3;a++) {
          const idx = m3+a;
          // Spring home plus its damper, wind, and a little air resistance.
          const accel = force[idx]
            + k*(target[idx]-pos[idx]) - c*vel[idx] - T.drag*vel[idx]*Math.abs(vel[idx]);
          vel[idx] += accel*h*(1-hold);
          prev[idx] = pos[idx];
          pos[idx] += vel[idx]*h*(1-hold);
        }
      }
      this.#solveDistance(h2);
      this.#shapeMatch(T.shape);
      this.#solveCollisions();
      for (let i=0;i<n;i++) {
        const m3=i*3;
        for (let a=0;a<3;a++) vel[m3+a] = (pos[m3+a]-prev[m3+a])/h;
      }
    }
    this.force.fill(0);
  }

  // Forget the patch rotations carried over from the last motion. A patch
  // that's nearly a straight strip can't tell how far it's been twisted about
  // its own length, so after a big turn it keeps a stale twist that the
  // fabric then settles into. Starting over from the way the whole cloak is
  // facing, whenever a motion ends, lets it come back clean.
  resetFrames(q = IDENTITY) {
    const Q = this.rQuat;
    for (let r = 0; r < this.n; r++) { Q[r*4] = q.x; Q[r*4+1] = q.y; Q[r*4+2] = q.z; Q[r*4+3] = q.w; }
  }

  // Re-read the compliances after the tuning object has changed.
  retune() { for (const [start, n, key] of this.groups) this.cc.fill(this.t[key], start, start + n); }

  addForce(i, x, y, z) { const n=i*3; this.force[n]+=x; this.force[n+1]+=y; this.force[n+2]+=z; }

  energy() {
    let acc=0;
    for (let i=0;i<this.n;i++) {
      const n=i*3;
      acc += Math.abs(this.pos[n]-this.rest[n]) + Math.abs(this.pos[n+1]-this.rest[n+1])
           + Math.abs(this.pos[n+2]-this.rest[n+2]);
    }
    return acc/this.n;
  }

  // Worst interpenetration currently present, as a fraction of fabric
  // thickness. Zero means no two pieces of cloth are inside each other.
  worstOverlap() {
    let worst = 0;
    for (let c=0;c<this.pairCount;c++) {
      const p=this.pa[c]*3, q=this.pb[c]*3, sep=this.psep[c];
      const d = Math.hypot(this.pos[q]-this.pos[p], this.pos[q+1]-this.pos[p+1], this.pos[q+2]-this.pos[p+2]);
      if (d < sep) worst = Math.max(worst, (sep-d)/sep);
    }
    return worst;
  }
}

// ===========================================================================
// 3 · Scene
//
// One fabric, one colour. Everything darker than #FF6625 on screen — including
// the deep tone inside the fold that the flat artwork draws as #D0470C — is
// the carpet's own shading: the curl turns away from the key light and casts
// onto its own underside.
// ===========================================================================

const BRAND = { face:'#FF6625', bounce:'#7A2600', sky:'#FFF3E6', page:'#FBF8EF' };

const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
} catch (err) {
  canvas.style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('fallback').style.display='block';
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;   // keep the brand orange exact where fully lit

const pageColor = () =>
  getComputedStyle(document.documentElement).getPropertyValue('--page').trim() || BRAND.page;
const applyGround = () => renderer.setClearColor(new THREE.Color(pageColor()), 1);
applyGround();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyGround);
new MutationObserver(applyGround).observe(document.documentElement, { attributeFilter:['data-theme'] });

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.21;

const mesh = buildLogoMesh();
const cloth = new Cloth(mesh, CARPET);

// The simulation runs on a single surface; what's drawn is that surface given
// real thickness — a face, a back, and the cut edge between them — rebuilt
// from the simulated positions every frame.
const sim = new THREE.BufferGeometry();
sim.setAttribute('position', new THREE.BufferAttribute(cloth.pos, 3));
sim.setIndex(new THREE.BufferAttribute(mesh.indices, 1));

const N = mesh.count, F = mesh.indices.length / 3;
const rim = [...new Set(mesh.boundary)];
const rimIndex = new Map(rim.map((v, k) => [v, k]));
const B = rim.length;
const shell = {
  pos: new Float32Array((2*N + 2*B) * 3),
  inside: new Float32Array(2*N + 2*B),
  index: new Uint32Array((2*F + mesh.boundary.length) * 3),
};
{
  const I = mesh.indices, X = shell.index;
  let t = 0;
  for (let f = 0; f < F; f++) {                               // face
    X[t++] = I[f*3]; X[t++] = I[f*3+1]; X[t++] = I[f*3+2];
  }
  for (let f = 0; f < F; f++) {                               // back, wound the other way
    X[t++] = N + I[f*3]; X[t++] = N + I[f*3+2]; X[t++] = N + I[f*3+1];
  }
  for (let e = 0; e < mesh.boundary.length; e += 2) {         // cut edge
    const ta = 2*N + rimIndex.get(mesh.boundary[e]),   tb = 2*N + rimIndex.get(mesh.boundary[e+1]);
    const ba = ta + B, bb = tb + B;
    X[t++] = ta; X[t++] = ba; X[t++] = bb;
    X[t++] = ta; X[t++] = bb; X[t++] = tb;
  }
  shell.inside.fill(0, 0, N); shell.inside.fill(1, N, 2*N); shell.inside.fill(0.4, 2*N);
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(shell.pos, 3));
geometry.setAttribute('aInside', new THREE.BufferAttribute(shell.inside, 1));
geometry.setIndex(new THREE.BufferAttribute(shell.index, 1));

function updateRender() {
  sim.attributes.position.needsUpdate = true;
  sim.computeVertexNormals();
  const P = cloth.pos, Nm = sim.attributes.normal.array, S = shell.pos, h = CARPET.render / 2;
  for (let i = 0; i < N; i++) {
    for (let c = 0; c < 3; c++) {
      S[i*3+c]     = P[i*3+c] + Nm[i*3+c]*h;
      S[(N+i)*3+c] = P[i*3+c] - Nm[i*3+c]*h;
    }
  }
  for (let k = 0; k < B; k++) {
    const v = rim[k];
    for (let c = 0; c < 3; c++) {
      S[(2*N+k)*3+c]   = S[v*3+c];
      S[(2*N+B+k)*3+c] = S[(N+v)*3+c];
    }
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
}
updateRender();

const material = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(BRAND.face),
  roughness: 0.62, metalness: 0.0,
  sheen: 1.0, sheenColor: new THREE.Color('#FFCDB4'), sheenRoughness: 0.5,
  side: THREE.FrontSide,
  envMapIntensity: 0.5,
});

// Cavity shading. The back of the carpet is the inside of the curl, and the
// inside is occluded — it sees far less of the room than the face does.
// Darkening and warming it there is what turns the flat artwork's #D0470C
// into something the lighting produces rather than a second material.
const INTERIOR = { darken: 1.0, tint: new THREE.Color('#C03806'), mix: 0.55 };
material.onBeforeCompile = (shader) => {
  shader.uniforms.uInteriorDarken = { value: INTERIOR.darken };
  shader.uniforms.uInteriorTint = { value: INTERIOR.tint };
  shader.uniforms.uInteriorMix = { value: INTERIOR.mix };
  shader.vertexShader = 'attribute float aInside;\nvarying float vInside;\n'
    + shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vInside = aInside;');
  shader.fragmentShader =
    'uniform float uInteriorDarken;\nuniform vec3 uInteriorTint;\nuniform float uInteriorMix;\nvarying float vInside;\n'
    + shader.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
       diffuseColor.rgb = mix(diffuseColor.rgb,
         mix(diffuseColor.rgb * uInteriorDarken, uInteriorTint, uInteriorMix), vInside);`);
  material.userData.shader = shader;
};

const cloak = new THREE.Mesh(geometry, material);
cloak.castShadow = true; cloak.receiveShadow = true;
scene.add(cloak);

geometry.computeBoundingBox();
const CENTER = new THREE.Vector3();
geometry.boundingBox.getCenter(CENTER);
const FLOOR = geometry.boundingBox.min.y - 0.65;

// Key rakes across the drape from the upper left, which is what drops the
// inside of the fold into shadow.
const key = new THREE.DirectionalLight(0xFFF1E4, 2.55);
key.position.set(-2.4, 3.2, 2.8);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -2.2; key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2;   key.shadow.camera.bottom = -2.2;
key.shadow.camera.near = 0.5;  key.shadow.camera.far = 12;
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.018; key.shadow.radius = 2.5;
scene.add(key, key.target);
key.target.position.copy(CENTER);

const fill = new THREE.DirectionalLight(0xF0E4E0, 0.26);
fill.position.set(3.0, -0.6, 1.4);
scene.add(fill);

// Warm bounce from below tints the shadowed interior toward the brand's dark
// orange rather than letting it go grey.
scene.add(new THREE.HemisphereLight(new THREE.Color(BRAND.sky), new THREE.Color(BRAND.bounce), 0.34));

const groundShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.14 })
);
groundShadow.rotation.x = -Math.PI/2;
groundShadow.position.set(CENTER.x, FLOOR, CENTER.z);
groundShadow.receiveShadow = true;
scene.add(groundShadow);

// ===========================================================================
// 4 · Camera, orbit, and flying it around
// ===========================================================================

// Orthographic on purpose. Under perspective the left tip — which sits well
// behind the right — would shrink by about 6%, and the home view would stop
// being the logo. Ortho keeps the mark exact head-on and still orbits freely.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const HOME = new THREE.Vector3(CENTER.x, CENTER.y, CENTER.z + 6);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(CENTER);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.screenSpacePanning = true;
controls.minZoom = 0.35; controls.maxZoom = 6;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const aspect = w/h, fit = 1.30;
  const hw = aspect > VIEW.hw/VIEW.hh ? VIEW.hh*fit*aspect : VIEW.hw*fit;
  const hh = aspect > VIEW.hw/VIEW.hh ? VIEW.hh*fit : VIEW.hw*fit/aspect;
  camera.left=-hw; camera.right=hw; camera.top=hh; camera.bottom=-hh;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
controls.update();

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const grabPoint = new THREE.Vector3();
const dragPoint = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
let grabbed = [];          // {i, ox, oy, oz, w}
let dragging = false, interacted = false;

const setNdc = (ev) => {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((ev.clientX-r.left)/r.width)*2-1;
  ndc.y = -((ev.clientY-r.top)/r.height)*2+1;
};

canvas.addEventListener('pointerdown', (ev) => {
  setNdc(ev);
  ray.setFromCamera(ndc, camera);
  geometry.computeBoundingSphere();
  const hit = ray.intersectObject(cloak, false)[0];
  if (!hit) return;                               // empty space: leave it to the orbit
  hitPoint.copy(hit.point);
  grabPoint.copy(hit.point);
  dragPoint.copy(hit.point);
  dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), hit.point);

  // Take a small handful and let the carpet's own stiffness carry the rest.
  // The handful moves without turning, so the bigger it is the more it kinks
  // against a carpet that is turning as it's swung.
  const R = CARPET.grab, R2 = R*R;
  grabbed = [];
  cloth.held.fill(0);
  for (let i=0;i<mesh.count;i++) {
    const n=i*3;
    const dx=cloth.pos[n]-hit.point.x, dy=cloth.pos[n+1]-hit.point.y, dz=cloth.pos[n+2]-hit.point.z;
    const d2 = dx*dx+dy*dy+dz*dz;
    if (d2 > R2) continue;
    const t = 1 - Math.sqrt(d2)/R;
    const w = t*t*(3-2*t);                        // smooth falloff
    cloth.held[i] = w;
    grabbed.push({ i, ox:dx, oy:dy, oz:dz, w });
  }
  if (!grabbed.length) return;
  let nearest = grabbed[0];
  for (const g of grabbed) if (g.w > nearest.w) nearest = g;
  takeHold(hit.point, nearest.i);                 // caught mid-flight too: it's yours now
  dragging = true;
  controls.enabled = false;
  canvas.classList.add('grabbing');
  canvas.setPointerCapture(ev.pointerId);
  interacted = true;
  document.getElementById('hint').classList.add('gone');
});

canvas.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  setNdc(ev);
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(dragPlane, dragPoint);
});

const release = () => {
  if (!dragging) return;
  dragging = false;
  cloth.held.fill(0);
  cloth.resetFrames(rig.q);
  grabbed = [];
  controls.enabled = true;
  canvas.classList.remove('grabbing');
  if (rig.mode === 'held') flyHome();
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

canvas.addEventListener('dblclick', () => {
  camera.position.copy(HOME);
  controls.target.copy(CENTER);
  controls.update();
});

// ===========================================================================
// 5 · Loop
// ===========================================================================

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), frozen = false, lastFrameMs = 0;
let touching = 0;                 // seconds the released carpet has been touching itself
const UNTANGLE_AFTER = 0.8;

// ===========================================================================
// 5a · The path it follows
//
// Whatever is steering the cloak — the entrance, your pointer, or the flight
// home when you let go — moves one rigid pose: where the logo should be and
// which way it should face. Every part of the cloak follows that pose as it
// was a moment ago, later the further that part is from whatever is leading.
// So the lead goes exactly where it's steered, everything behind it passes
// through the same path after it, and the physics adds the billow and trail.
// ===========================================================================

const FOLLOW = {
  lag: 0.16,               // seconds each unit of fabric runs behind the lead
  turn: 1.0,               // how fully it swings round to stream behind the way it's flown
  turnTime: 0.4,           // seconds to swing round
  turnRate: 2.0,           // radians per second at most: spinning it about the hand any faster crumples it
  uprightTime: 0.5,        // seconds to come upright again once the pointer stops
  bank: 0.18,              // roll into a turn, per radian per second of turning
  bankMax: 0.9,            // radians
  slow: 0.25, fast: 2.0,   // pointer speeds, units/s: upright below, fully streaming above
  flutter: 1.5,            // extra ripple at full speed
  home: 0.9,               // seconds of flight home, plus a little more per unit of distance
  carry: 0.8,              // how much of a throw it carries before curving home
  fling: 5.0,              // units/s: the hardest throw it will carry
};

const IDENTITY = new THREE.Quaternion();
const HISTORY = 128;             // poses kept: well over a second, more than the longest lag
const rig = {
  mode: 'rest',                  // 'intro' · 'held' · 'home' · 'rest'
  // The pose: a point x of the rest pose goes to q·x + T.
  q: new THREE.Quaternion(), T: new THREE.Vector3(),
  dist: Float32Array.from(mesh.along),   // how far each point is from the lead, in rest units
  lead: Float32Array.from(mesh.along),   // ... and what that's easing toward when the lead changes
  reach: 0,                              // the largest of those
  ht: new Float64Array(HISTORY), hq: new Float32Array(HISTORY*4), hp: new Float32Array(HISTORY*3),
  head: 0, filled: 0, moved: -Infinity,
  target: new Float32Array(mesh.count*3), pose: new Float32Array(7),
};
let simTime = 0;                 // seconds of simulation, which is what every path runs on

const restCentre = new THREE.Vector3();
for (let i = 0; i < mesh.count; i++) restCentre.x += mesh.rest[i*3], restCentre.y += mesh.rest[i*3+1], restCentre.z += mesh.rest[i*3+2];
restCentre.divideScalar(mesh.count);

// Distances across the fabric from one point, along its edges: how far a
// pull has to travel through the cloth to get anywhere. Straight-line
// distance would put the inside of the curl right next to the body.
const walk = (() => {
  const n = mesh.count, E = mesh.edges, R = mesh.rest, deg = new Int32Array(n + 1);
  for (let e = 0; e < E.length; e++) deg[E[e] + 1]++;
  for (let i = 0; i < n; i++) deg[i + 1] += deg[i];
  const to = new Int32Array(E.length), len = new Float32Array(E.length), fill = deg.slice(0, n);
  for (let e = 0; e < E.length; e += 2) {
    const a = E[e], b = E[e+1];
    const l = Math.hypot(R[a*3]-R[b*3], R[a*3+1]-R[b*3+1], R[a*3+2]-R[b*3+2]);
    to[fill[a]] = b; len[fill[a]++] = l; to[fill[b]] = a; len[fill[b]++] = l;
  }
  return (src) => {
    const d = new Float32Array(n).fill(Infinity), done = new Uint8Array(n);
    d[src] = 0;
    for (let it = 0; it < n; it++) {
      let u = -1, best = Infinity;
      for (let i = 0; i < n; i++) if (!done[i] && d[i] < best) { best = d[i]; u = i; }
      if (u < 0) break;
      done[u] = 1;
      for (let k = deg[u]; k < deg[u+1]; k++) if (d[u] + len[k] < d[to[k]]) d[to[k]] = d[u] + len[k];
    }
    return d;
  };
})();

function setLead(dist, now) {
  rig.lead.set(dist);
  if (now) rig.dist.set(dist);
  let far = 0; for (let i = 0; i < mesh.count; i++) far = Math.max(far, rig.dist[i], dist[i]);
  rig.reach = far;
}

function forgetPath() { rig.head = 0; rig.filled = 0; }

function recordPose() {
  const k = rig.head;
  rig.ht[k] = simTime;
  rig.hq[k*4] = rig.q.x; rig.hq[k*4+1] = rig.q.y; rig.hq[k*4+2] = rig.q.z; rig.hq[k*4+3] = rig.q.w;
  rig.hp[k*3] = rig.T.x; rig.hp[k*3+1] = rig.T.y; rig.hp[k*3+2] = rig.T.z;
  rig.head = (k + 1) % HISTORY; rig.filled = Math.min(rig.filled + 1, HISTORY);
  if (rig.mode !== 'rest') rig.moved = simTime;
}

// The pose as it was at time t, blended between the two poses either side.
function poseAt(t, out) {
  const { ht, hq, hp } = rig;
  let b = (rig.head - 1 + HISTORY) % HISTORY;
  const pick = (i) => { for (let c = 0; c < 4; c++) out[c] = hq[i*4+c]; for (let c = 0; c < 3; c++) out[4+c] = hp[i*3+c]; };
  if (rig.filled < 2 || t >= ht[b]) return pick(b);
  for (let s = 1; s < rig.filled; s++) {
    const a = (b - 1 + HISTORY) % HISTORY;
    if (ht[a] <= t) {
      const f = (t - ht[a]) / Math.max(ht[b] - ht[a], 1e-6);
      const dot = hq[a*4]*hq[b*4] + hq[a*4+1]*hq[b*4+1] + hq[a*4+2]*hq[b*4+2] + hq[a*4+3]*hq[b*4+3];
      const sb = dot < 0 ? -f : f;
      let l = 0;
      for (let c = 0; c < 4; c++) { out[c] = hq[a*4+c]*(1-f) + hq[b*4+c]*sb; l += out[c]*out[c]; }
      l = 1/Math.sqrt(l || 1); for (let c = 0; c < 4; c++) out[c] *= l;
      for (let c = 0; c < 3; c++) out[4+c] = hp[a*3+c]*(1-f) + hp[b*3+c]*f;
      return;
    }
    b = a;
  }
  pick(b);
}

// Where every point should be: the rest pose, carried by the pose as it was
// when the lead was where that point is now.
function followPath() {
  if (rig.mode === 'rest' && simTime - rig.moved > FOLLOW.lag*rig.reach + 0.1) { cloth.target = cloth.rest; return; }
  const R = mesh.rest, X = rig.target, P = rig.pose;
  for (let i = 0; i < mesh.count; i++) {
    poseAt(simTime - FOLLOW.lag*rig.dist[i], P);
    const qx = P[0], qy = P[1], qz = P[2], qw = P[3];
    const vx = R[i*3], vy = R[i*3+1], vz = R[i*3+2];
    // v + 2w(q×v) + 2q×(q×v)
    const cx = qy*vz - qz*vy, cy = qz*vx - qx*vz, cz = qx*vy - qy*vx;
    X[i*3]   = vx + 2*(qw*cx + qy*cz - qz*cy) + P[4];
    X[i*3+1] = vy + 2*(qw*cy + qz*cx - qx*cz) + P[5];
    X[i*3+2] = vz + 2*(qw*cz + qx*cy - qy*cx) + P[6];
  }
  cloth.target = X;
}

function settleRig() {
  rig.mode = 'rest';
  rig.q.identity(); rig.T.set(0, 0, 0);
  cloth.homeScale = 1;
}

// ---- the entrance ----------------------------------------------------------
//
// The lead is the tip. It flies a swooping arc in from off-screen, turning
// from edge-on to face-on as it lands, and the rest of the cloak comes
// through the same arc behind it.

const ENTRANCE = {
  duration: 2.6,                  // seconds from off-screen to landed
  delay: 0.15,                    // a beat of empty page first
  // Offsets from home, as a cubic Bézier: in from the upper left and slightly
  // behind, swooping low toward the viewer, past centre, rising into place.
  path: [[-2.9, 1.8, -0.8], [-1.1, -1.4, 0.7], [1.3, -0.4, 0.3], [0, 0, 0]],
  turn: [0.3, -1.0, 0.5],         // starting attitude, radians: banked and edge-on
  loose: 0.32,                    // home spring while flying, as a share of normal: loose, so it trails
  flutter: 4.0,                   // extra ripple while flying, fading on landing
};

const intro = {
  active: false, t0: 0,
  pivot: new THREE.Vector3(...[0,1,2].map(c => mesh.rest[mesh.tip*3+c])),
  from: new THREE.Quaternion().setFromEuler(new THREE.Euler(...ENTRANCE.turn)),
  v: new THREE.Vector3(),
};
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x-a)/(b-a), 0), 1); return t*t*(3-2*t); };

function bezier(t) {
  const [a, b, c, d] = ENTRANCE.path, m = 1 - t;
  return [0,1,2].map(i => m*m*m*a[i] + 3*m*m*t*b[i] + 3*m*t*t*c[i] + t*t*t*d[i]);
}

// Steer the lead to progress p of the flight.
function introPose(p) {
  const off = bezier(easeOut(p)), pv = intro.pivot;
  rig.q.copy(intro.from).slerp(IDENTITY, easeInOut(Math.min(p / 0.85, 1)));
  intro.v.copy(pv).applyQuaternion(rig.q);
  rig.T.set(pv.x + off[0] - intro.v.x, pv.y + off[1] - intro.v.y, pv.z + off[2] - intro.v.z);
  cloth.homeScale = ENTRANCE.loose + (1 - ENTRANCE.loose) * smooth(0.55, 1.0, p);
}

function startIntro() {
  if (reduced) return;
  intro.active = true;
  intro.t0 = simTime + ENTRANCE.delay;
  rig.mode = 'intro';
  setLead(mesh.along, true);
  introPose(0);
  forgetPath(); recordPose(); followPath();
  cloth.pos.set(rig.target); cloth.prev.set(rig.target); cloth.vel.fill(0);
}

function endIntro() { intro.active = false; cloth.homeScale = 1; }

// ---- your pointer ------------------------------------------------------------
//
// The lead is wherever you took hold. Fly it and the cloak swings round to
// stream behind the way it's going, banking into turns; slow down and it
// comes upright again, still in your hand.

const hold = {
  h: new THREE.Vector3(),        // the point of the rest pose under the hand
  body: new THREE.Vector3(),     // from there toward the middle of the cloak, in the rest pose
  size: 0,                       // ... and how far that is
  base: new THREE.Quaternion(),  // the attitude before banking
  q0: new THREE.Quaternion(),    // the pose when it was picked up, for carrying the handful
  bank: 0, v: new THREE.Vector3(), last: new THREE.Vector3(), speed: 0,
  flown: false,                  // has it been flown since it last came to rest in the hand?
  a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), r: new THREE.Quaternion(),
};

function takeHold(point, nearest) {
  if (intro.active) endIntro();
  // Take over the pose from whatever was steering it, so nothing jumps.
  hold.base.copy(rig.q); hold.q0.copy(rig.q); hold.bank = 0;
  hold.h.copy(point).sub(rig.T).applyQuaternion(hold.r.copy(rig.q).invert());
  hold.body.copy(restCentre).sub(hold.h); hold.size = hold.body.length(); hold.body.normalize();
  hold.v.set(0, 0, 0); hold.last.copy(point); hold.speed = 0; hold.flown = false;
  setLead(walk(nearest), false);
  rig.mode = 'held';
  cloth.homeScale = 1;
}

function steerHeld(dt) {
  const a = dragPlane.normal;
  hold.c.subVectors(dragPoint, hold.last).divideScalar(dt); hold.last.copy(dragPoint);
  hold.v.lerp(hold.c, Math.min(1, dt/0.08));
  const speed = hold.speed = hold.v.length();
  const stream = FOLLOW.turn * smooth(FOLLOW.slow, FOLLOW.fast, speed) * smooth(0.15, 0.5, hold.size);

  // Swing round, about the hand, until the body trails behind the way it's
  // being flown.
  let yaw = 0;
  hold.b.copy(hold.body).applyQuaternion(hold.base);
  hold.b.addScaledVector(a, -hold.b.dot(a));                     // as seen on screen
  if (hold.b.lengthSq() > 1e-6 && speed > 1e-4) {
    hold.c.copy(hold.v).multiplyScalar(-1/speed);                 // straight behind
    const across = hold.a.crossVectors(hold.b, hold.c).dot(a), along = hold.b.dot(hold.c);
    yaw = stream * Math.atan2(across, along) * Math.min(1, dt/FOLLOW.turnTime);
    yaw = Math.max(-FOLLOW.turnRate*dt, Math.min(FOLLOW.turnRate*dt, yaw));
    hold.base.premultiply(hold.r.setFromAxisAngle(a, yaw));
  }
  // ... and come upright again as it slows.
  hold.base.slerp(IDENTITY, (1 - stream) * Math.min(1, dt/FOLLOW.uprightTime));

  // Bank into the turn, about the length of the body.
  const want = Math.max(-FOLLOW.bankMax, Math.min(FOLLOW.bankMax, FOLLOW.bank * yaw/dt));
  hold.bank += (want - hold.bank) * Math.min(1, dt/0.25);
  hold.c.copy(hold.body).applyQuaternion(hold.base);
  rig.q.setFromAxisAngle(hold.c, hold.bank).multiply(hold.base);
  rig.T.copy(dragPoint).sub(hold.c.copy(hold.h).applyQuaternion(rig.q));

  // Once it's been flown and has come to rest upright in your hand, that's a
  // motion ended too: start its patches over, as on landing.
  if (stream > 0.2) hold.flown = true;
  else if (hold.flown && stream < 0.02 && Math.abs(rig.q.w) > 0.9995) { cloth.resetFrames(rig.q); hold.flown = false; }
}

// ---- the flight home -----------------------------------------------------------
//
// Let go and the lead carries the throw, curves round and comes home, and
// the cloak follows it in.

const flight = {
  t0: 0, D: 1, p: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()],
  q0: new THREE.Quaternion(), speed: 0, v: new THREE.Vector3(),
};

function flyHome() {
  const [p0, p1, p2, p3] = flight.p;
  p0.copy(hold.h).applyQuaternion(rig.q).add(rig.T);      // where the hand let go
  p3.copy(hold.h);                                          // where that point lives at rest
  const D = flight.D = Math.min(FOLLOW.home + 0.25*p0.distanceTo(p3), 1.8);
  // easeOut starts at three times the speed, and a Bézier at three times its
  // first leg: so this first leg makes it leave at the speed it was thrown.
  const fling = Math.min(1, FOLLOW.fling / Math.max(hold.speed, 1e-6));
  p1.copy(p0).addScaledVector(hold.v, fling * FOLLOW.carry * D/9);
  p2.copy(p1).lerp(p3, 0.6);
  flight.q0.copy(rig.q); flight.t0 = simTime; flight.speed = hold.speed;
  rig.mode = 'home';
}

function steerHome() {
  const u = Math.min((simTime - flight.t0) / flight.D, 1);
  const [p0, p1, p2, p3] = flight.p, s = easeOut(u), m = 1 - s;
  flight.v.set(0, 0, 0).addScaledVector(p0, m*m*m).addScaledVector(p1, 3*m*m*s)
    .addScaledVector(p2, 3*m*s*s).addScaledVector(p3, s*s*s);
  rig.q.copy(flight.q0).slerp(IDENTITY, easeInOut(u));
  rig.T.copy(flight.v).sub(hold.c.copy(hold.h).applyQuaternion(rig.q));
  const loose = CARPET.springHeld / CARPET.springHome;
  cloth.homeScale = loose + (1 - loose) * smooth(0.5, 1.0, u);
  if (u >= 1) { settleRig(); setLead(mesh.along, false); cloth.resetFrames(); }    // landed
  return u;
}

function frame(now) {
  if (!reduced) requestAnimationFrame(frame);
  // Never zero: XPBD divides compliance by the substep squared, and a zero
  // frame turns that into Infinity * 0 = NaN, which poisons every position.
  const dt = Math.min(Math.max((now-last)/1000, 1/1000), 1/30); last = now;

  if (!frozen) {
    const t = now/1000;
    simTime += dt;

    // Steer the lead, then lay the cloak's path out behind it.
    let flutter = 1;
    if (rig.mode === 'intro') {
      const p = (simTime - intro.t0) / ENTRANCE.duration;
      if (p >= 1) { endIntro(); settleRig(); cloth.resetFrames(); }   // landed
      else { introPose(Math.max(p, 0)); flutter = 1 + ENTRANCE.flutter * (1 - smooth(0.4, 1.0, Math.max(p, 0))); }
    } else if (rig.mode === 'held') {
      steerHeld(dt);
      flutter = 1 + FOLLOW.flutter * smooth(FOLLOW.slow, FOLLOW.fast, hold.speed);
    } else if (rig.mode === 'home') {
      const u = steerHome();
      flutter = 1 + FOLLOW.flutter * smooth(FOLLOW.slow, FOLLOW.fast, flight.speed) * (1 - smooth(0, 0.8, u));
    }
    for (let i = 0, e = Math.min(1, dt/0.3); i < mesh.count; i++) rig.dist[i] += (rig.lead[i] - rig.dist[i]) * e;
    recordPose();
    followPath();
    if (!reduced) {
      // Hovering: a slow ripple running back from the lead — the tip, or your
      // hand while you hold it — pushing along the surface normal so the
      // carpet undulates rather than drifts, plus a gentle swell of the whole
      // thing.
      const { force } = cloth, Nm = sim.attributes.normal.array;
      const k = 2*Math.PI / CARPET.waveLength, w = CARPET.waveSpeed;
      const swellX = (Math.sin(t*0.41)*0.9 + Math.sin(t*0.23)*0.4) * 0.35;
      const swellY = (Math.sin(t*0.57)*0.8 + Math.cos(t*0.31)*0.35) * 0.35;
      for (let i=0;i<mesh.count;i++) {
        const n=i*3, free = 1 - mesh.anchor[i];
        const ripple = CARPET.wave * flutter * free * Math.sin(k*rig.dist[i] - w*t);
        force[n]   += swellX + Nm[n]*ripple;
        force[n+1] += swellY + Nm[n+1]*ripple;
        force[n+2] +=          Nm[n+2]*ripple;
      }
    }

    {
      // Air pushing back on the faces. It resists the carpet moving
      // face-first but lets it slide edgeways, which is what makes it billow
      // and trail when it's swung, and what keeps it from shivering.
      const { force, vel } = cloth, Nm = sim.attributes.normal.array;
      for (let i=0;i<mesh.count;i++) {
        const n=i*3;
        const vn = vel[n]*Nm[n] + vel[n+1]*Nm[n+1] + vel[n+2]*Nm[n+2];
        force[n]   -= CARPET.aero * vn * Nm[n];
        force[n+1] -= CARPET.aero * vn * Nm[n+1];
        force[n+2] -= CARPET.aero * vn * Nm[n+2];
      }
    }

    if (dragging) {
      // Carry the held handful to the pointer, turning with the cloak, and
      // keep its velocity so letting go mid-flick actually throws it.
      hold.r.copy(hold.q0).invert().premultiply(rig.q);
      for (const g of grabbed) {
        const n = g.i*3;
        hold.c.set(g.ox, g.oy, g.oz).applyQuaternion(hold.r);
        const tx = dragPoint.x + hold.c.x, ty = dragPoint.y + hold.c.y, tz = dragPoint.z + hold.c.z;
        // Only as fast as each point is actually carried: the soft edge of the
        // handful moves part of the way, and giving it the hand's full speed
        // made it overshoot and fold.
        const carry = g.w / Math.max(dt,1e-3);
        cloth.vel[n]   = (tx - cloth.pos[n])*carry;
        cloth.vel[n+1] = (ty - cloth.pos[n+1])*carry;
        cloth.vel[n+2] = (tz - cloth.pos[n+2])*carry;
        cloth.pos[n]   += (tx - cloth.pos[n])*g.w;
        cloth.pos[n+1] += (ty - cloth.pos[n+1])*g.w;
        cloth.pos[n+2] += (tz - cloth.pos[n+2])*g.w;
      }
    }

    // A settled carpet cannot be inside itself, so the broad phase only earns
    // its cost while something is actually moving.
    if (rig.mode !== 'rest' || cloth.energy() > 0.004) cloth.buildPairs(); else cloth.pairCount = 0;

    // Untangling. The rest pose never touches itself, so a carpet that keeps
    // touching itself once it's been let go is tangled — and self-collision,
    // which normally keeps it clean, is exactly what stops it finding its way
    // back. So after a moment of that, let it pass through itself until it's
    // clear, then turn collision back on. It always gets home.
    if (rig.mode === 'held' || rig.mode === 'intro') { touching = 0; cloth.collide = true; }
    else if (cloth.pairCount > 0) { touching += dt; if (touching > UNTANGLE_AFTER) cloth.collide = false; }
    else { touching = 0; cloth.collide = true; }
    cloth.step(dt, dragging);
    updateRender();
  }

  if (!frozen) controls.update();     // frozen means a test owns the camera
  renderer.render(scene, camera);
  lastFrameMs = performance.now() - now;
}

if (reduced) {
  updateRender();
  controls.update();
  renderer.render(scene, camera);
} else {
  startIntro();
  requestAnimationFrame(frame);
  addEventListener('keydown', (ev) => {
    if ((ev.key === 'r' || ev.key === 'R') && !dragging) startIntro();
  });
  setTimeout(() => { if (!interacted) document.getElementById('hint').classList.add('gone'); }, 11000);
}

// Hooks for the checks in verify.mjs / motion.mjs / interact.mjs.
window.__cloak = {
  homeView(px, py, keepState) {
    frozen = true;
    if (!keepState) {
      if (intro.active) endIntro();
      settleRig(); setLead(mesh.along, true); forgetPath(); rig.moved = -Infinity;
      cloth.target = cloth.rest;
      cloth.pos.set(cloth.rest); cloth.vel.fill(0); cloth.resetFrames();
    }
    updateRender();
    renderer.setPixelRatio(1); renderer.setSize(px, py, false);
    canvas.style.width = px+'px'; canvas.style.height = py+'px';
    camera.position.set(0, 0, 6);
    controls.target.set(0, 0, 0);
    camera.zoom = 1;
    camera.left=-VIEW.hw; camera.right=VIEW.hw; camera.top=VIEW.hh; camera.bottom=-VIEW.hh;
    camera.updateProjectionMatrix();
    camera.lookAt(0,0,0); camera.updateMatrixWorld();   // not controls.update(): it owns its own state
    renderer.render(scene, camera);
  },
  orbit(theta, phi) {
    const r = 6;
    camera.position.set(r*Math.sin(theta)*Math.cos(phi), r*Math.sin(phi), r*Math.cos(theta)*Math.cos(phi));
    camera.lookAt(0,0,0); camera.updateMatrixWorld();
    renderer.render(scene, camera);
  },
  poke(strength = 1) {
    frozen = false;
    for (let i=0;i<mesh.count;i++) {
      const n=i*3, free = 1 - mesh.anchor[i]*0.5;
      cloth.vel[n]   += 1.7*strength*free;
      cloth.vel[n+1] += 1.0*strength*free*Math.sin(mesh.uvs[i*2]*6.0);
      cloth.vel[n+2] += 1.4*strength*free;
    }
  },
  thaw() { frozen = false; },
  flyIn(overrides) {
    frozen = false;
    if (overrides) { Object.assign(ENTRANCE, overrides); intro.from.setFromEuler(new THREE.Euler(...ENTRANCE.turn)); }
    startIntro();
    return ENTRANCE.delay + ENTRANCE.duration;
  },
  follow(next) { Object.assign(FOLLOW, next); return { ...FOLLOW }; },
  flying: () => intro.active,
  following: () => rig.mode,      // what's steering it: intro · held · home · rest
  heading: () => 2*Math.acos(Math.min(1, Math.abs(rig.q.w))),   // how far the pose is turned from upright, radians
  clock: () => simTime - intro.t0,   // simulated seconds since the last fly-in began its flight
  untangling: () => !cloth.collide,
  _cloth: cloth,                  // for checks that need to stub the solver
  tune(next) { Object.assign(CARPET, next); cloth.retune(); return { ...CARPET, constraints: cloth.ca.length }; },
  setZoom(z) { camera.zoom = z; camera.updateProjectionMatrix(); renderer.render(scene, camera); },
  profile(n) {
    const t0=performance.now(); for(let i=0;i<n;i++) cloth.buildPairs(); const tPairs=(performance.now()-t0)/n;
    const t1=performance.now(); for(let i=0;i<n;i++) cloth.step(1/60,false); const tStep=(performance.now()-t1)/n;
    const t2=performance.now(); for(let i=0;i<n;i++) updateRender(); const tNorm=(performance.now()-t2)/n;
    const t3=performance.now(); for(let i=0;i<n;i++) renderer.render(scene,camera); const tDraw=(performance.now()-t3)/n;
    return { pairs:+tPairs.toFixed(2), solve:+tStep.toFixed(2), normals:+tNorm.toFixed(2), draw:+tDraw.toFixed(2) };
  },
  // How carpet-like the motion is. crease: the sharpest fold between two
  // neighbouring faces, as a change from rest (paper creases, carpet can't).
  // roughness: how much the displacement varies from a point to its
  // neighbours, relative to its size — wrinkles and jitter score high, broad
  // smooth waves score low.
  feel() {
    if (!this._feel) {
      const I = mesh.indices, map = new Map();
      const nb = Array.from({ length: mesh.count }, () => new Set());
      for (let t=0; t<I.length; t+=3) {
        const tri = [I[t], I[t+1], I[t+2]];
        for (let e=0; e<3; e++) {
          const a=tri[e], b=tri[(e+1)%3], c=tri[(e+2)%3];
          nb[a].add(b); nb[b].add(a);
          const k = a<b ? a*1e6+b : b*1e6+a, v = map.get(k);
          if (v) v.push(c); else map.set(k, [a,b,c]);
        }
      }
      // Skip hinges on sliver triangles: their normals swing wildly under
      // tiny motions, which reads as a fold nobody can see.
      const P0 = mesh.rest, len = (u,v) => Math.hypot(P0[u*3]-P0[v*3], P0[u*3+1]-P0[v*3+1], P0[u*3+2]-P0[v*3+2]);
      const quality = (a,b,c) => {
        const ab=len(a,b), bc=len(b,c), ca=len(c,a), s=(ab+bc+ca)/2, L=Math.max(ab,bc,ca);
        return 2*Math.sqrt(Math.max(0, s*(s-ab)*(s-bc)*(s-ca))) / (L*L);
      };
      const hinges = [];
      let slivers = 0;
      for (const v of map.values()) if (v.length === 4) {
        if (quality(v[0],v[1],v[2]) < 0.12 || quality(v[0],v[1],v[3]) < 0.12) { slivers++; continue; }
        hinges.push(...v);
      }
      const angle = (P, a,b,c,d) => {
        const ax=P[a*3],ay=P[a*3+1],az=P[a*3+2];
        const ex=P[b*3]-ax, ey=P[b*3+1]-ay, ez=P[b*3+2]-az;
        const cx=P[c*3]-ax, cy=P[c*3+1]-ay, cz=P[c*3+2]-az;
        const dx=P[d*3]-ax, dy=P[d*3+1]-ay, dz=P[d*3+2]-az;
        const n1=[ey*cz-ez*cy, ez*cx-ex*cz, ex*cy-ey*cx];
        const n2=[dy*ez-dz*ey, dz*ex-dx*ez, dx*ey-dy*ex];
        const l=Math.hypot(...n1)*Math.hypot(...n2)||1;
        return Math.acos(Math.max(-1, Math.min(1, (n1[0]*n2[0]+n1[1]*n2[1]+n1[2]*n2[2])/l)));
      };
      const rest = new Float32Array(hinges.length/4);
      for (let h=0; h<rest.length; h++) rest[h] = angle(mesh.rest, ...hinges.slice(h*4, h*4+4));
      this._feel = { hinges, rest, angle, slivers, nb: nb.map(x => Int32Array.from(x)) };
    }
    const { hinges, rest, angle, nb, slivers } = this._feel, P = cloth.pos, R = cloth.rest;
    const dev = new Float32Array(rest.length);
    for (let h=0; h<rest.length; h++)
      dev[h] = Math.abs(angle(P, hinges[h*4], hinges[h*4+1], hinges[h*4+2], hinges[h*4+3]) - rest[h]) * 180/Math.PI;
    const sorted = Array.from(dev).sort((a,b)=>a-b);
    let worst = 0; for (let h=1; h<dev.length; h++) if (dev[h] > dev[worst]) worst = h;
    const wa = hinges[worst*4], wb = hinges[worst*4+1];
    const where = { along: +((mesh.along[wa]+mesh.along[wb])/2).toFixed(3),
      edge: +Math.hypot(R[wa*3]-R[wb*3], R[wa*3+1]-R[wb*3+1], R[wa*3+2]-R[wb*3+2]).toFixed(4),
      held: +Math.max(cloth.held[wa], cloth.held[wb]).toFixed(2),
      rim: mesh.boundary.includes(wa) || mesh.boundary.includes(wb),
      over45: dev.filter(d => d > 45).length, measured: rest.length, skipped: slivers };
    let lap = 0, mag = 0;
    for (let i=0; i<mesh.count; i++) {
      const di = [P[i*3]-R[i*3], P[i*3+1]-R[i*3+1], P[i*3+2]-R[i*3+2]];
      const m = [0,0,0];
      for (const j of nb[i]) for (let c=0; c<3; c++) m[c] += P[j*3+c]-R[j*3+c];
      const k = nb[i].length || 1;
      lap += Math.hypot(di[0]-m[0]/k, di[1]-m[1]/k, di[2]-m[2]/k);
      mag += Math.hypot(...di);
    }
    return { creaseMax: sorted[sorted.length-1], creaseP95: sorted[Math.floor(sorted.length*0.95)],
             roughness: mag > 1e-6 ? lap/mag : 0, where };
  },
  // Mean distance from rest as a share of the carpet's width — how far from
  // home it looks, in terms that don't depend on the mesh.
  offHome() {
    let d = 0;
    for (let i=0;i<mesh.count;i++) d += Math.hypot(cloth.pos[i*3]-cloth.rest[i*3], cloth.pos[i*3+1]-cloth.rest[i*3+1], cloth.pos[i*3+2]-cloth.rest[i*3+2]);
    return d / mesh.count / 2.0;
  },
  energy: () => cloth.energy(),
  overlap: () => cloth.worstOverlap(),
  pairs: () => cloth.pairCount,
  frameMs: () => lastFrameMs,
  stats: { verts: mesh.count, tris: mesh.indices.length/3, source: mesh.source, rim: mesh.rimLoop },
};
</script>
